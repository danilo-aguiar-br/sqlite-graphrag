[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-musl" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "warn"
unmaintained = "workspace"
# Transitive advisories accepted without an upgrade available.
#
# Empty by construction. An ignore entry that matches nothing is worse than no
# entry: cargo-deny downgrades it to `advisory-not-detected`, which nobody reads,
# while the line keeps signalling that a risk was considered and handled.
#
# RUSTSEC-2025-0119 was dropped in the v1.0.79 audit when fastembed and its
# transitive number_prefix dependency left the tree in v1.0.76.
# RUSTSEC-2024-0436 (paste 1.0.15 unmaintained) was dropped on 2026-08-22 for the
# same reason: cargo-deny reported it as matching no crate in the current graph.
#
# Add an entry only with the crate that pulls the advisory in and the condition
# that retires it, so a stale ignore is removable without re-deriving why it exists.
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "Zlib",
    "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
